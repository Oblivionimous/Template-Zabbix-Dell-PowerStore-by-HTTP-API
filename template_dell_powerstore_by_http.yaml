          type: DEPENDENT
          key: powerstore.hardware.not_healthy
          delay: '0'
          history: 7d
          description: 'Quantidade de componentes com lifecycle_state diferente de Healthy e Empty.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var hw = JSON.parse(value), n = 0;
                  hw.forEach(function (h) {
                      if (h.lifecycle_state !== 'Healthy' && h.lifecycle_state !== 'Empty') { n++; }
                  });
                  return n;
          master_item:
            key: powerstore.hardware.get
          tags:
