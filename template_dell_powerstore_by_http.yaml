            - uuid: 3d2987b7b548414f9d25b10076cf6f04
              name: 'Appliance {#NAME}: métricas de performance em bloco (bruto)'
              type: HTTP_AGENT
              key: 'powerstore.appliance.perf.get[{#ID}]'
              delay: '{$POWERSTORE.INTERVAL.PERF}'
              history: '0'
              value_type: TEXT
              trends: '0'
              authtype: BASIC
              username: '{$POWERSTORE.API.USER}'
              password: '{$POWERSTORE.API.PASSWORD}'
              description: 'Última amostra de 5 minutos de performance_metrics_by_appliance.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[-1]'
                  error_handler: DISCARD_VALUE
              timeout: '{$POWERSTORE.API.TIMEOUT}'
              url: '{$POWERSTORE.API.URL}/metrics/generate'
              post_type: JSON
              posts: '{"entity": "performance_metrics_by_appliance", "entity_id": "{#ID}", "interval": "Five_Mins"}'
              headers:
                - name: Accept
                  value: application/json
              request_method: POST
              tags:
                - tag: appliance
                  value: '{#NAME}'
                - tag: component
                  value: raw
            - uuid: 315c277d178d418ba85ef55d88442f34
