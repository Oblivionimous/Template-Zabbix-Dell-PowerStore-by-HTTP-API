        - uuid: 2ce50fb36391428497d9bd1b42fd8091
          name: 'Hardware: componentes em falha ou desconectados'
          type: DEPENDENT
          key: powerstore.hardware.failed
          delay: '0'
          history: 7d
          description: 'Quantidade de componentes com lifecycle_state Failed, Prepare_Failed ou Disconnected. Indicador para dashboards e mapas.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var hw = JSON.parse(value), n = 0;
                  hw.forEach(function (h) {
                      if (h.lifecycle_state === 'Failed' || h.lifecycle_state === 'Prepare_Failed' || h.lifecycle_state === 'Disconnected') { n++; }
                  });
                  return n;
          master_item:
            key: powerstore.hardware.get
          tags:
            - tag: component
              value: hardware
            - tag: component
              value: health
        - uuid: e7aac0e1f43d4851b37d5a637199520e
