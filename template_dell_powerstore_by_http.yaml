            - uuid: 6e95f2a9eb724f1181ace005d5447191
              name: 'NAS server {#NAME}: estado operacional'
              type: DEPENDENT
              key: 'powerstore.nas_server.status[{#ID}]'
              delay: '0'
              valuemap:
                name: 'PowerStore NAS server status'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.id==''{#ID}'')].operational_status.first()'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var map = {'Started': 0, 'Starting': 1, 'Stopping': 2, 'Stopped': 3, 'Failover': 4, 'Degraded': 5};
                      return map.hasOwnProperty(value) ? map[value] : 10;
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: powerstore.nas_server.get
              tags:
                - tag: component
                  value: health
                - tag: nas_server
                  value: '{#NAME}'
              trigger_prototypes:
                - uuid: 2eb03a9ebf944711a6e7440af40452e7
                  expression: 'last(/Dell PowerStore by HTTP/powerstore.nas_server.status[{#ID}])=4 or last(/Dell PowerStore by HTTP/powerstore.nas_server.status[{#ID}])=5'
                  name: 'NAS server {#NAME}: degradado ou em failover'
                  opdata: 'Estado: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: 'O NAS server está em Failover ou Degraded. Verifique o node de origem.'
                  tags:
                    - tag: scope
                      value: availability
                - uuid: 2bdd591a1b974ef7a330412accd5d260
                  expression: 'last(/Dell PowerStore by HTTP/powerstore.nas_server.status[{#ID}])=3'
                  name: 'NAS server {#NAME}: parado'
                  priority: HIGH
                  description: 'O NAS server está Stopped. Os compartilhamentos NFS e SMB dele ficam indisponíveis.'
                  tags:
                    - tag: scope
                      value: availability
          master_item:
            key: powerstore.nas_server.get
          lld_macro_paths:
            - lld_macro: '{#ID}'
              path: $.id
            - lld_macro: '{#NAME}'
              path: $.name
