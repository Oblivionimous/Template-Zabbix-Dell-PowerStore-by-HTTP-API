                  opdata: 'Usado: {ITEM.LASTVALUE1}'
                  priority: HIGH
                  description: 'O file system está próximo do limite. Clientes NFS ou SMB podem receber erro de disco cheio.'
                  tags:
                    - tag: scope
                      value: capacity
                - uuid: cd60cba1d01b40cfa7993500d0538210
