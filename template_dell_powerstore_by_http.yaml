      macros:
        - macro: '{$POWERSTORE.API.LIMIT}'
          value: '2000'
          description: 'Parâmetro limit das listas. O padrão da API é 100 itens por página, o máximo é 2000.'
        - macro: '{$POWERSTORE.API.PASSWORD}'
          type: SECRET_TEXT
          description: 'Senha do usuário da API.'
        - macro: '{$POWERSTORE.API.TIMEOUT}'
          value: 30s
          description: 'Timeout das requisições HTTP.'
        - macro: '{$POWERSTORE.API.URL}'
          value: 'https://CHANGE_ME/api/rest'
          description: 'URL base da API REST, sem barra no final. Exemplo https://10.0.0.10/api/rest'
        - macro: '{$POWERSTORE.API.USER}'
          description: 'Usuário local ou LDAP do PowerStore. O perfil Operator é suficiente (somente leitura).'
        - macro: '{$POWERSTORE.CPU.UTIL.MAX}'
          value: '80'
          description: 'Utilização máxima de CPU de I/O em percentual. Aceita contexto.'
        - macro: '{$POWERSTORE.DRIVE.ENDURANCE.MIN.HIGH}'
          value: '5'
          description: 'Percentual mínimo de endurance restante do SSD para alerta crítico.'
        - macro: '{$POWERSTORE.DRIVE.ENDURANCE.MIN.WARN}'
          value: '20'
          description: 'Percentual mínimo de endurance restante do SSD para alerta de atenção.'
        - macro: '{$POWERSTORE.FS.NAME.MATCHES}'
          value: '.*'
          description: 'Regex dos nomes de file systems a descobrir.'
        - macro: '{$POWERSTORE.FS.NAME.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'Regex dos nomes de file systems a ignorar.'
        - macro: '{$POWERSTORE.FS.PUSED.MAX.HIGH}'
          value: '95'
          description: 'Percentual de uso crítico por file system. Aceita contexto com o nome do file system.'
        - macro: '{$POWERSTORE.FS.PUSED.MAX.WARN}'
          value: '85'
          description: 'Percentual de uso de atenção por file system. Aceita contexto com o nome do file system.'
        - macro: '{$POWERSTORE.HOST.NAME.MATCHES}'
          value: '.*'
          description: 'Regex dos nomes de hosts do storage a descobrir.'
        - macro: '{$POWERSTORE.HOST.NAME.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'Regex dos nomes de hosts do storage a ignorar.'
        - macro: '{$POWERSTORE.HW.STATE.NOT_MATCHES}'
          value: ^Empty$
          description: 'Regex de lifecycle_state ignorado na descoberta (slots vazios).'
        - macro: '{$POWERSTORE.HW.TYPE.MATCHES}'
          value: '.*'
          description: 'Regex dos tipos de hardware a descobrir.'
        - macro: '{$POWERSTORE.HW.TYPE.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'Regex dos tipos de hardware a ignorar. Exemplo ^(SFP|Internal_M2)$'
        - macro: '{$POWERSTORE.INTERVAL.CONFIG}'
          value: 5m
          description: 'Intervalo de coleta das listas de objetos (volumes, file systems, hosts e outros).'
        - macro: '{$POWERSTORE.INTERVAL.HEALTH}'
          value: 2m
          description: 'Intervalo de coleta de hardware, portas, alertas, replicação e status da API.'
        - macro: '{$POWERSTORE.INTERVAL.PERF}'
          value: 5m
          description: 'Intervalo de coleta de performance de cluster, appliances e nodes. A API entrega amostras de 5 minutos. O intervalo Twenty_Sec foi testado e leva mais de 2 minutos para responder.'
        - macro: '{$POWERSTORE.INTERVAL.PERF.OBJ}'
          value: 5m
          description: 'Intervalo de coleta de performance de volumes, file systems, hosts, portas e NAS servers (média de 5 minutos).'
        - macro: '{$POWERSTORE.INTERVAL.SPACE}'
          value: 5m
          description: 'Intervalo de coleta das métricas de capacidade.'
        - macro: '{$POWERSTORE.LATENCY.MAX.HIGH}'
          value: '0.02'
          description: 'Latência média crítica em segundos para cluster, appliance e node (0.02 = 20 ms). Aceita contexto.'
        - macro: '{$POWERSTORE.LATENCY.MAX.WARN}'
          value: '0.005'
          description: 'Latência média de atenção em segundos para cluster, appliance e node (0.005 = 5 ms). Aceita contexto.'
        - macro: '{$POWERSTORE.NODATA.TIMEOUT}'
          value: 10m
          description: 'Tempo sem resposta da API para disparar o trigger de indisponibilidade.'
        - macro: '{$POWERSTORE.PORT.ERRORS.MAX}'
          value: '1'
          description: 'Erros CRC por segundo tolerados em porta Ethernet. Aceita contexto com o nome da porta.'
        - macro: '{$POWERSTORE.PORT.NAME.MATCHES}'
          value: '.*'
          description: 'Regex dos nomes de portas Ethernet e FC a descobrir.'
        - macro: '{$POWERSTORE.PORT.NAME.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'Regex dos nomes de portas Ethernet e FC a ignorar.'
        - macro: '{$POWERSTORE.PUSED.MAX.HIGH}'
          value: '90'
          description: 'Percentual de uso físico crítico para cluster e appliance.'
        - macro: '{$POWERSTORE.PUSED.MAX.WARN}'
          value: '80'
          description: 'Percentual de uso físico de atenção para cluster e appliance.'
        - macro: '{$POWERSTORE.REPL.STATE.CRIT}'
          value: ^(Error|System_Paused)$
          description: 'Regex dos estados de replicação tratados como erro.'
        - macro: '{$POWERSTORE.REPL.STATE.WARN}'
          value: ^(Paused)$
          description: 'Regex dos estados de replicação tratados como atenção.'
        - macro: '{$POWERSTORE.VOLUME.LATENCY.MAX.WARN}'
          value: '0.02'
          description: 'Latência média de atenção por volume em segundos. Aceita contexto com o nome do volume.'
        - macro: '{$POWERSTORE.VOLUME.NAME.MATCHES}'
          value: '.*'
          description: 'Regex dos nomes de volumes a descobrir.'
        - macro: '{$POWERSTORE.VOLUME.NAME.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'Regex dos nomes de volumes a ignorar.'
        - macro: '{$POWERSTORE.VOLUME.PUSED.MAX.WARN}'
          value: '95'
          description: 'Percentual de uso lógico de atenção por volume. Aceita contexto com o nome do volume.'
      valuemaps:
        - uuid: d86b11015b554edaaadeb56988788c9f
          name: 'PowerStore lifecycle state'
          mappings:
            - value: '0'
              newvalue: Healthy
            - value: '1'
              newvalue: Empty
            - value: '2'
              newvalue: Initializing
            - value: '3'
              newvalue: Trigger_Update
            - value: '4'
              newvalue: Disconnected
            - value: '5'
              newvalue: Uninitialized
            - value: '6'
              newvalue: Failed
            - value: '7'
              newvalue: Prepare_Failed
            - value: '10'
              newvalue: Unknown
        - uuid: dc8d361cf9804a649e88a69eeac10249
          name: 'PowerStore link status'
          mappings:
            - value: '0'
              newvalue: Down
            - value: '1'
              newvalue: Up
        - uuid: c9e2a8c2832b4166beda6a2e575835ec
          name: 'PowerStore NAS server status'
          mappings:
            - value: '0'
              newvalue: Started
            - value: '1'
              newvalue: Starting
            - value: '2'
              newvalue: Stopping
            - value: '3'
              newvalue: Stopped
            - value: '4'
              newvalue: Failover
            - value: '5'
              newvalue: Degraded
            - value: '10'
              newvalue: Unknown
        - uuid: 1e613c09834c43f3816820b77eba607a
          name: 'PowerStore volume state'
          mappings:
            - value: '0'
              newvalue: Ready
            - value: '1'
              newvalue: Initializing
            - value: '2'
              newvalue: Offline
            - value: '3'
              newvalue: Destroying
            - value: '10'
              newvalue: Unknown
        - uuid: f1bbf872173e490d8805f2883899397e
          name: 'PowerStore yes/no'
          mappings:
            - value: '0'
              newvalue: Não
            - value: '1'
              newvalue: Sim
  triggers:
    - uuid: 12abfa30bcf54f70969b7a4af5fa5e42
      expression: 'last(/Dell PowerStore by HTTP/powerstore.alert.critical_unack)>0 and length(last(/Dell PowerStore by HTTP/powerstore.alert.list))>0'
      name: 'PowerStore: alertas Critical ativos'
      event_name: 'PowerStore: {ITEM.LASTVALUE1} alerta(s) Critical ativo(s)'
      priority: HIGH
