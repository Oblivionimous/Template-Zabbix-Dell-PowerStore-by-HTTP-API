        - uuid: 2550879533c649a1bbfaef2663fa0cfa
          name: 'Descoberta de portas SAS'
          type: DEPENDENT
          key: powerstore.sas_port.discovery
          delay: '0'
          enabled_lifetime_type: DISABLE_AFTER
          enabled_lifetime: 1d
          description: 'Descobre as portas SAS de back-end. O trigger dispara apenas na transição de link ativo para inativo.'
          item_prototypes:
            - uuid: 121a153c4e534839b4470c3dc14392ff
              name: 'Porta SAS {#NAME}: link'
              type: DEPENDENT
              key: 'powerstore.sas_port.link_up[{#NAME}]'
              delay: '0'
              description: 'Portas SAS ligam o appliance às gavetas de expansão.'
              valuemap:
                name: 'PowerStore link status'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.name==''{#NAME}'')].is_link_up.first()'
                - type: BOOL_TO_DECIMAL
                  parameters:
                    - ''
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 10m
              master_item:
                key: powerstore.sas_port.get
              tags:
                - tag: component
                  value: network
                - tag: port
                  value: '{#NAME}'
                - tag: port.type
                  value: SAS
              trigger_prototypes:
                - uuid: 672b270f633a4cb4babfb1d14a31410c
                  expression: 'last(/Dell PowerStore by HTTP/powerstore.sas_port.link_up[{#NAME}])=0 and last(/Dell PowerStore by HTTP/powerstore.sas_port.link_up[{#NAME}],#2)=1'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'last(/Dell PowerStore by HTTP/powerstore.sas_port.link_up[{#NAME}])=1'
                  name: 'Porta SAS {#NAME}: link caiu'
                  priority: HIGH
                  description: 'A porta SAS perdeu o link após estar ativa. Verifique o cabo e a gaveta de expansão conectada.'
                  tags:
                    - tag: component
                      value: network
                    - tag: scope
                      value: availability
            - uuid: 605eee057d9543b49d3e9126f96cd4bb
              name: 'Porta SAS {#NAME}: velocidade negociada'
              type: DEPENDENT
              key: 'powerstore.sas_port.speed[{#NAME}]'
              delay: '0'
              units: bps
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.name==''{#NAME}'')].current_speed.first()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var m = String(value).match(/^(\d+(?:\.\d+)?)_(Mbps|Gbps)$/i);
                      if (!m) {
                          return 0;
                      }
                      return parseFloat(m[1]) * (m[2].toLowerCase() === 'gbps' ? 1000000000 : 1000000);
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: powerstore.sas_port.get
              tags:
                - tag: component
                  value: network
                - tag: port
                  value: '{#NAME}'
                - tag: port.type
                  value: SAS
          master_item:
            key: powerstore.sas_port.get
          lld_macro_paths:
            - lld_macro: '{#ID}'
              path: $.id
            - lld_macro: '{#NAME}'
              path: $.name
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
        - uuid: 8d61a027a0864d4785d19a8ce3698e4c
