          description: 'Descobre os volumes (exceto snapshots) e cria estado, performance e capacidade. Filtre pelo nome com {$POWERSTORE.VOLUME.NAME.MATCHES} e {$POWERSTORE.VOLUME.NAME.NOT_MATCHES}.'
