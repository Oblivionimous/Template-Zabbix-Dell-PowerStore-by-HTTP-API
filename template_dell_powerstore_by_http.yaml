        - uuid: e609973e72824a1db2484020c1d108fc
          name: 'Descoberta de hardware'
          type: DEPENDENT
          key: powerstore.hardware.discovery
          delay: '0'
          filter:
            evaltype: AND
            conditions:
              - macro: '{#LIFECYCLE_STATE}'
                value: '{$POWERSTORE.HW.STATE.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: A
              - macro: '{#TYPE}'
                value: '{$POWERSTORE.HW.TYPE.MATCHES}'
                formulaid: B
              - macro: '{#TYPE}'
                value: '{$POWERSTORE.HW.TYPE.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: C
          enabled_lifetime_type: DISABLE_AFTER
          enabled_lifetime: 1d
          description: 'Descobre todos os componentes de hardware (Node, Drive, DIMM, Fan, Power_Supply, Battery, SFP, IO_Module e outros). Slots vazios (lifecycle_state Empty) ficam fora por padrão via {$POWERSTORE.HW.STATE.NOT_MATCHES}.'
          item_prototypes:
            - uuid: a8e565c6f45848808627f51f70941bce
              name: '{#TYPE} {#NAME}: part number'
              type: DEPENDENT
              key: 'powerstore.hardware.part[{#ID}]'
              delay: '0'
              value_type: CHAR
              trends: '0'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.id==''{#ID}'')].part_number.first()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: N/A
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: powerstore.hardware.get
              tags:
                - tag: component
                  value: inventory
                - tag: hardware
                  value: '{#TYPE}'
                - tag: hardware.name
                  value: '{#NAME}'
            - uuid: cf349adc9ed2467884cf5b9daacdb8e2
