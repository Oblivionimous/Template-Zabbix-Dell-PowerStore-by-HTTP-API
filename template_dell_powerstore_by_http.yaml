                  expression: 'find(/Dell PowerStore by HTTP/powerstore.replication.state[{#ID}],,"regexp","{$POWERSTORE.REPL.STATE.CRIT}")=1'
                  name: 'Replicação {#RESOURCE_TYPE} {#LOCAL_RESOURCE_ID}: sessão com erro'
