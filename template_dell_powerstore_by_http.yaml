                  opdata: 'Usado: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: 'O file system ultrapassou o limite de atenção. Planeje expansão ou limpeza.'
                  dependencies:
                    - name: 'File system {#NAME}: espaço usado acima de {$POWERSTORE.FS.PUSED.MAX.HIGH:"{#NAME}"}%'
                      expression: 'min(/Dell PowerStore by HTTP/powerstore.file_system.pused[{#ID}],15m)>{$POWERSTORE.FS.PUSED.MAX.HIGH:"{#NAME}"}'
