              history: 7d
              value_type: FLOAT
              units: '%'
              description: 'Percentual de size_used sobre size_total.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.id==''{#ID}'')].first()'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var f = JSON.parse(value);
                      if (!f.size_total) { throw 'size_total ausente ou zero'; }
                      return (100 * f.size_used / f.size_total).toFixed(2);
              master_item:
                key: powerstore.file_system.get
              tags:
                - tag: component
                  value: capacity
                - tag: filesystem
                  value: '{#NAME}'
