zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: ee883eb2769a4db39d76892238fb75ed
      name: PowerStore
  templates:
    - uuid: 1b278afea0da45fa9427cbad24acaf6e
      template: 'Dell PowerStore by HTTP'
      name: 'Dell PowerStore by HTTP'
      description: |
        Monitoramento do Dell PowerStore (modelos T e Q) pela API REST, com HTTP agent e itens dependentes.
        
        Autor: mauro.paiva
        Versão: 7.0 (Zabbix 7.0 LTS)
        
        Configuração
        1. Crie no PowerStore um usuário com perfil Operator (somente leitura).
        2. Vincule o template ao host que representa o cluster. O host não precisa de interface.
        3. Preencha no host as macros {$POWERSTORE.API.URL}, {$POWERSTORE.API.USER} e {$POWERSTORE.API.PASSWORD}.
        4. Ajuste limites e filtros de descoberta pelas demais macros {$POWERSTORE.*}.
        5. Para preencher o inventário, deixe o modo de inventário do host em Automático.
        
        Coleta
        Listas de objetos usam GET com select=* e limit={$POWERSTORE.API.LIMIT}. Métricas usam POST em /metrics/generate e guardam só a amostra mais recente.
        Latências chegam em microssegundos e são convertidas para segundos. A utilização de CPU chega como fração e é convertida para percentual.
        
        Changelog 7.0
        Chaves, nomes, tags e descrições padronizados. Macros com prefixo POWERSTORE e senha como macro secreta.
        Correção do filtro JSONPath do item "em uso" das portas FC, da tag errada no trigger de link Ethernet e da URL duplicada de appliance.
        Remoção da macro inexistente {$APPLIANCE_ID} e unificação das descobertas de DIMM e drive em uma descoberta de hardware.
        Novos itens de alertas ativos, versão do PowerStoreOS, inventário, estado de volumes e NAS servers, capacidade percentual, desgaste de SSD,
        tráfego e erros de portas Ethernet, performance de portas FC, portas SAS, sessões de replicação, status da API e protótipos de gráfico.
      vendor:
        name: mauro.paiva
        version: '7.0'
      groups:
        - name: PowerStore
      items:
        - uuid: 3430b1c42d844ed69dca364fa1ca72b6
          name: 'Alertas: Critical ativos'
          type: DEPENDENT
          key: powerstore.alert.critical
          delay: '0'
          history: 7d
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.critical
          master_item:
            key: powerstore.alert.summary
          tags:
            - tag: component
              value: alerts
        - uuid: 4ac945b51a5c418eb73c0de0dbe35f8b
          name: 'Alertas: Critical não reconhecidos'
          type: DEPENDENT
          key: powerstore.alert.critical_unack
          delay: '0'
          history: 7d
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.critical_unack
          master_item:
            key: powerstore.alert.summary
          tags:
            - tag: component
              value: alerts
        - uuid: 241eea6008194f009f4ead72ac38bddc
          name: 'Alertas: dados brutos'
          type: HTTP_AGENT
          key: powerstore.alert.get
          delay: '{$POWERSTORE.INTERVAL.HEALTH}'
          history: '0'
          value_type: TEXT
          trends: '0'
          authtype: BASIC
          username: '{$POWERSTORE.API.USER}'
          password: '{$POWERSTORE.API.PASSWORD}'
          description: 'Alertas no estado ACTIVE (GET /alert?state=eq.ACTIVE).'
          timeout: '{$POWERSTORE.API.TIMEOUT}'
          url: '{$POWERSTORE.API.URL}/alert'
          query_fields:
            - name: select
              value: 'id,severity,state,resource_type,resource_name,description_l10n,generated_timestamp,is_acknowledged'
            - name: state
              value: eq.ACTIVE
            - name: limit
              value: '{$POWERSTORE.API.LIMIT}'
          status_codes: '200,206'
          headers:
            - name: Accept
              value: application/json
          tags:
            - tag: component
              value: raw
        - uuid: 46942d6a441b4afcac9adbfaf69279bf
          name: 'Alertas: Info ativos'
          type: DEPENDENT
          key: powerstore.alert.info
          delay: '0'
          history: 7d
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.info
          master_item:
            key: powerstore.alert.summary
          tags:
            - tag: component
              value: alerts
        - uuid: fd5cec271c7a43d59a8644afc84bc926
          name: 'Alertas: Critical e Major pendentes'
          type: DEPENDENT
          key: powerstore.alert.list
          delay: '0'
          history: 7d
          value_type: TEXT
          trends: '0'
          description: 'Lista (até 20 linhas) dos alertas Critical e Major ativos e não reconhecidos no PowerStore Manager.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var alerts = JSON.parse(value);
                  var out = [];
                  alerts.forEach(function (a) {
                      var s = String(a.severity || '');
                      if ((s === 'Critical' || s === 'Major') && !a.is_acknowledged) {
                          out.push('[' + s + '] ' + (a.resource_name || '-') + ': ' + (a.description_l10n || '-'));
                      }
                  });
                  if (out.length === 0) {
                      return 'Nenhum alerta Critical ou Major pendente';
                  }
                  return out.slice(0, 20).join('\n');
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: powerstore.alert.get
          tags:
            - tag: component
              value: alerts
        - uuid: ad66dbed3e214c72a006a01342de2aaf
          name: 'Alertas: Major ativos'
          type: DEPENDENT
          key: powerstore.alert.major
          delay: '0'
          history: 7d
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.major
          master_item:
            key: powerstore.alert.summary
          tags:
            - tag: component
              value: alerts
        - uuid: dde60b58f33d42bca520d396ecd2853b
          name: 'Alertas: Major não reconhecidos'
          type: DEPENDENT
          key: powerstore.alert.major_unack
          delay: '0'
          history: 7d
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.major_unack
          master_item:
            key: powerstore.alert.summary
          tags:
            - tag: component
              value: alerts
        - uuid: 3de5bbcbac0a47c395f91c5a632dc4dc
          name: 'Alertas: Minor ativos'
          type: DEPENDENT
          key: powerstore.alert.minor
          delay: '0'
          history: 7d
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.minor
          master_item:
            key: powerstore.alert.summary
          tags:
            - tag: component
              value: alerts
        - uuid: fe2255af646a47da90b5749b9868e13b
          name: 'Alertas: resumo'
          type: DEPENDENT
          key: powerstore.alert.summary
          delay: '0'
          history: '0'
          value_type: TEXT
          trends: '0'
          description: 'Contagem de alertas ativos por severidade, gerada em JavaScript. Mestre dos contadores de alertas.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var alerts = JSON.parse(value);
                  var r = {critical: 0, major: 0, minor: 0, info: 0, total: 0, critical_unack: 0, major_unack: 0};
                  alerts.forEach(function (a) {
                      var s = String(a.severity || '').toLowerCase();
                      r.total++;
                      if (r.hasOwnProperty(s) && s !== 'total') {
                          r[s]++;
                      }
                      if (!a.is_acknowledged) {
                          if (s === 'critical') { r.critical_unack++; }
                          if (s === 'major') { r.major_unack++; }
                      }
                  });
                  return JSON.stringify(r);
          master_item:
            key: powerstore.alert.get
          tags:
            - tag: component
              value: raw
        - uuid: 5e3c8e2c2f6047daaed3b696002b34e3
          name: 'Alertas: total ativos'
          type: DEPENDENT
          key: powerstore.alert.total
          delay: '0'
          history: 7d
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.total
          master_item:
            key: powerstore.alert.summary
          tags:
            - tag: component
              value: alerts
        - uuid: ad2ca46c67864cd5b07f192190b10ce5
          name: 'API: código de status HTTP'
          type: HTTP_AGENT
          key: powerstore.api.status
          delay: '{$POWERSTORE.INTERVAL.HEALTH}'
          history: 7d
          authtype: BASIC
          username: '{$POWERSTORE.API.USER}'
          password: '{$POWERSTORE.API.PASSWORD}'
          description: 'Código HTTP retornado por uma consulta leve ao endpoint /cluster. Valor 200 indica API disponível e credenciais válidas. 401 indica falha de autenticação.'
          preprocessing:
            - type: REGEX
              parameters:
                - 'HTTP\/[\d.]+\s+(\d{3})'
                - \1
          timeout: '{$POWERSTORE.API.TIMEOUT}'
          url: '{$POWERSTORE.API.URL}/cluster'
          query_fields:
            - name: select
              value: id
          status_codes: ''
          headers:
            - name: Accept
              value: application/json
          retrieve_mode: HEADERS
          tags:
            - tag: component
              value: api
            - tag: component
              value: health
          triggers:
            - uuid: 8c4e3717aed94f1ab7133d5eae9a684f
              expression: 'last(/Dell PowerStore by HTTP/powerstore.api.status)<>200'
              name: 'PowerStore: API respondeu com código HTTP inesperado'
              opdata: 'HTTP {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'A API retornou um código diferente de 200. O código 401 indica usuário ou senha inválidos em {$POWERSTORE.API.USER} e {$POWERSTORE.API.PASSWORD}. O código 403 indica usuário sem permissão de leitura.'
              dependencies:
                - name: 'PowerStore: API sem resposta'
                  expression: 'nodata(/Dell PowerStore by HTTP/powerstore.api.status,{$POWERSTORE.NODATA.TIMEOUT})=1'
              tags:
                - tag: scope
                  value: availability
            - uuid: 590f0fdd3f6742cd893cf72ff64c50ed
              expression: 'nodata(/Dell PowerStore by HTTP/powerstore.api.status,{$POWERSTORE.NODATA.TIMEOUT})=1'
              name: 'PowerStore: API sem resposta'
              event_name: 'PowerStore: API sem resposta há {$POWERSTORE.NODATA.TIMEOUT}'
              priority: HIGH
              description: 'O Zabbix não recebe resposta da API REST do PowerStore dentro do tempo definido em {$POWERSTORE.NODATA.TIMEOUT}. Verifique conectividade HTTPS (porta 443) entre o Zabbix Server/Proxy e o IP de gerência, e o serviço de gerência do cluster.'
              tags:
                - tag: scope
                  value: availability
        - uuid: 7958a44537444408868d5e7a9c330ca1
          name: 'Inventário: quantidade de Appliances'
          type: DEPENDENT
          key: powerstore.appliance.count
          delay: '0'
          history: 7d
          description: 'Quantidade de objetos retornados pela API. Listas acima de {$POWERSTORE.API.LIMIT} objetos retornam paginadas (HTTP 206) e o valor fica limitado a esse número.'
          preprocessing:
