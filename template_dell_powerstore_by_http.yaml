      discovery_rules:
        - uuid: 0c2adc2607f44dc89b81f6cd050c8750
          name: 'Descoberta de appliances'
          type: DEPENDENT
          key: powerstore.appliance.discovery
          delay: '0'
          enabled_lifetime_type: DISABLE_AFTER
          enabled_lifetime: 1d
          description: 'Descobre os appliances do cluster e cria métricas de performance, CPU e capacidade por appliance.'
          item_prototypes:
            - uuid: dd737b34d31f42d8ae0f106efafb9965
              name: 'Appliance {#NAME}: tolerância a falha de drives'
              type: DEPENDENT
              key: 'powerstore.appliance.drive_ft[{#ID}]'
              delay: '0'
              value_type: CHAR
              trends: '0'
              description: 'Nível de proteção DRE (Single ou Double) contra falha simultânea de drives.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.id==''{#ID}'')].drive_failure_tolerance_level.first()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: N/A
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: powerstore.appliance.get
              tags:
                - tag: appliance
                  value: '{#NAME}'
                - tag: component
                  value: system
            - uuid: e665525666334dc8ae5d045d56290057
              name: 'Appliance {#NAME}: modelo'
              type: DEPENDENT
              key: 'powerstore.appliance.model[{#ID}]'
              delay: '0'
              value_type: CHAR
              trends: '0'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.id==''{#ID}'')].model.first()'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: powerstore.appliance.get
              tags:
                - tag: appliance
                  value: '{#NAME}'
                - tag: component
                  value: system
            - uuid: 2aabb032d9cb40be9fb2a089ffb28fbc
              name: 'Appliance {#NAME}: quantidade de nodes'
              type: DEPENDENT
              key: 'powerstore.appliance.node_count[{#ID}]'
              delay: '0'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.id==''{#ID}'')].node_count.first()'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: powerstore.appliance.get
              tags:
                - tag: appliance
                  value: '{#NAME}'
                - tag: component
                  value: system
            - uuid: ba5d56a627a740549be885617b91bc96
              name: 'Appliance {#NAME}: Tamanho médio de I/O'
              type: DEPENDENT
              key: 'powerstore.appliance.perf.avg_io_size[{#ID}]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              units: B
              description: 'Tamanho médio das operações em bytes.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.avg_io_size
              master_item:
                key: 'powerstore.appliance.perf.get[{#ID}]'
              tags:
                - tag: appliance
                  value: '{#NAME}'
                - tag: component
                  value: performance
            - uuid: bae46e77e2c54186886ff0aa9450f4ae
              name: 'Appliance {#NAME}: Latência média'
              type: DEPENDENT
              key: 'powerstore.appliance.perf.avg_latency[{#ID}]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              units: s
              description: 'A API entrega o valor em microssegundos. O pré-processamento converte para segundos (multiplicador 0.000001).'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.avg_latency
                - type: MULTIPLIER
                  parameters:
                    - '1.0E-6'
              master_item:
                key: 'powerstore.appliance.perf.get[{#ID}]'
              tags:
                - tag: appliance
                  value: '{#NAME}'
                - tag: component
                  value: performance
              trigger_prototypes:
                - uuid: fdf4eb78fb0549c581f59fcb33cefb69
                  expression: 'min(/Dell PowerStore by HTTP/powerstore.appliance.perf.avg_latency[{#ID}],15m)>{$POWERSTORE.LATENCY.MAX.WARN:"{#NAME}"}'
                  name: 'Appliance {#NAME}: latência média acima do esperado'
                  opdata: 'Latência: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: 'A latência média ficou acima de {$POWERSTORE.LATENCY.MAX.WARN:"{#NAME}"} segundos durante 15m.'
                  dependencies:
                    - name: 'Appliance {#NAME}: latência média alta'
                      expression: 'min(/Dell PowerStore by HTTP/powerstore.appliance.perf.avg_latency[{#ID}],15m)>{$POWERSTORE.LATENCY.MAX.HIGH:"{#NAME}"}'
                  tags:
                    - tag: scope
                      value: performance
                - uuid: 9b31236c8a914b7b8471d0276bd80fcd
                  expression: 'min(/Dell PowerStore by HTTP/powerstore.appliance.perf.avg_latency[{#ID}],15m)>{$POWERSTORE.LATENCY.MAX.HIGH:"{#NAME}"}'
                  name: 'Appliance {#NAME}: latência média alta'
                  opdata: 'Latência: {ITEM.LASTVALUE1}'
                  priority: HIGH
                  description: 'A latência média ficou acima de {$POWERSTORE.LATENCY.MAX.HIGH:"{#NAME}"} segundos durante 15m. Verifique IOPS, throughput, utilização de CPU e portas de front-end.'
                  tags:
                    - tag: scope
                      value: performance
            - uuid: bea4841b5f5b47f8a2c202c5087b4f4f
              name: 'Appliance {#NAME}: Latência média de leitura'
              type: DEPENDENT
