              type: DEPENDENT
              key: 'powerstore.hardware.serial[{#ID}]'
              delay: '0'
              value_type: CHAR
              trends: '0'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.id==''{#ID}'')].serial_number.first()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: N/A
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: powerstore.hardware.get
              tags:
                - tag: component
                  value: inventory
                - tag: hardware
                  value: '{#TYPE}'
                - tag: hardware.name
                  value: '{#NAME}'
            - uuid: fadb53d1cfd841d493b8b044f13e8025
              name: '{#TYPE} {#NAME}: estado'
              type: DEPENDENT
              key: 'powerstore.hardware.state[{#ID}]'
              delay: '0'
              description: 'Estado do componente (lifecycle_state) convertido para número. Veja o value map PowerStore lifecycle state.'
              valuemap:
                name: 'PowerStore lifecycle state'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.id==''{#ID}'')].lifecycle_state.first()'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var map = {
                          'Healthy': 0, 'Empty': 1, 'Initializing': 2, 'Trigger_Update': 3,
                          'Disconnected': 4, 'Uninitialized': 5, 'Failed': 6, 'Prepare_Failed': 7
                      };
                      return map.hasOwnProperty(value) ? map[value] : 10;
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 10m
              master_item:
                key: powerstore.hardware.get
              tags:
                - tag: component
                  value: hardware
                - tag: component
                  value: health
                - tag: hardware
                  value: '{#TYPE}'
                - tag: hardware.name
                  value: '{#NAME}'
              trigger_prototypes:
                - uuid: 6dc446190ddf478f92c8232857543601
                  expression: 'last(/Dell PowerStore by HTTP/powerstore.hardware.state[{#ID}])=4'
                  name: '{#TYPE} {#NAME}: componente desconectado'
                  opdata: 'Estado: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: 'O componente {#NAME} (tipo {#TYPE}, slot {#SLOT}) foi removido ou perdeu comunicação com o sistema.'
                  tags:
                    - tag: scope
                      value: availability
                - uuid: 1c6b3eaa9bfa42bb9104c995be25b709
                  expression: 'last(/Dell PowerStore by HTTP/powerstore.hardware.state[{#ID}])=6 or last(/Dell PowerStore by HTTP/powerstore.hardware.state[{#ID}])=7'
                  name: '{#TYPE} {#NAME}: componente em falha'
                  opdata: 'Estado: {ITEM.LASTVALUE1}'
                  priority: HIGH
                  description: 'O componente {#NAME} (tipo {#TYPE}, slot {#SLOT}) reporta lifecycle_state Failed ou Prepare_Failed. Abra chamado na Dell com o service tag do appliance.'
                  tags:
                    - tag: scope
                      value: availability
                - uuid: 9959a9f94f0d4fd6bd3f07528f488e83
                  expression: 'min(/Dell PowerStore by HTTP/powerstore.hardware.state[{#ID}],30m)>=2'
                  name: '{#TYPE} {#NAME}: componente fora do estado Healthy'
                  opdata: 'Estado: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: 'O componente permanece há 30 minutos em estado diferente de Healthy e Empty (por exemplo Initializing, Uninitialized ou Trigger_Update).'
                  dependencies:
                    - name: '{#TYPE} {#NAME}: componente desconectado'
                      expression: 'last(/Dell PowerStore by HTTP/powerstore.hardware.state[{#ID}])=4'
                    - name: '{#TYPE} {#NAME}: componente em falha'
                      expression: 'last(/Dell PowerStore by HTTP/powerstore.hardware.state[{#ID}])=6 or last(/Dell PowerStore by HTTP/powerstore.hardware.state[{#ID}])=7'
                  tags:
                    - tag: scope
                      value: availability
          master_item:
            key: powerstore.hardware.get
          lld_macro_paths:
            - lld_macro: '{#APPLIANCE_ID}'
              path: $.appliance_id
            - lld_macro: '{#ID}'
              path: $.id
            - lld_macro: '{#LIFECYCLE_STATE}'
              path: $.lifecycle_state
            - lld_macro: '{#NAME}'
              path: $.name
            - lld_macro: '{#SLOT}'
              path: $.slot
            - lld_macro: '{#TYPE}'
              path: $.type
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
