        - uuid: 5966be07165d459ba8ada7793e0e1505
          name: 'Descoberta de drives (desgaste de SSD)'
          type: DEPENDENT
          key: powerstore.drive.discovery
          delay: '0'
          filter:
            evaltype: AND
            conditions:
              - macro: '{#LIFECYCLE_STATE}'
                value: '{$POWERSTORE.HW.STATE.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: A
              - macro: '{#TYPE}'
                value: ^Drive$
                formulaid: B
          enabled_lifetime_type: DISABLE_AFTER
          enabled_lifetime: 1d
          description: 'Descobre os drives presentes e coleta o desgaste (endurance) de cada SSD a cada hora.'
          item_prototypes:
            - uuid: 2c152edd94624c239fd7f81e013491c5
              name: 'Drive {#NAME}: vida útil restante'
              type: HTTP_AGENT
              key: 'powerstore.drive.endurance[{#ID}]'
              delay: 1h
              value_type: FLOAT
              units: '%'
              authtype: BASIC
              username: '{$POWERSTORE.API.USER}'
              password: '{$POWERSTORE.API.PASSWORD}'
              description: 'Percentual de endurance restante do SSD (percent_endurance_remaining de wear_metrics_by_drive).'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[-1].percent_endurance_remaining'
                  error_handler: DISCARD_VALUE
              timeout: '{$POWERSTORE.API.TIMEOUT}'
              url: '{$POWERSTORE.API.URL}/metrics/generate'
              post_type: JSON
              posts: '{"entity": "wear_metrics_by_drive", "entity_id": "{#ID}", "interval": "Five_Mins"}'
              headers:
                - name: Accept
                  value: application/json
              request_method: POST
              tags:
                - tag: component
                  value: hardware
                - tag: component
                  value: health
                - tag: hardware
                  value: Drive
                - tag: hardware.name
                  value: '{#NAME}'
              trigger_prototypes:
                - uuid: 28e023d71ff24b028f3d227f17e3af7f
                  expression: 'last(/Dell PowerStore by HTTP/powerstore.drive.endurance[{#ID}])<{$POWERSTORE.DRIVE.ENDURANCE.MIN.WARN}'
                  name: 'Drive {#NAME}: vida útil restante baixa'
                  opdata: 'Restante: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: 'O SSD tem menos de {$POWERSTORE.DRIVE.ENDURANCE.MIN.WARN}% de endurance restante.'
                  dependencies:
                    - name: 'Drive {#NAME}: vida útil restante crítica'
                      expression: 'last(/Dell PowerStore by HTTP/powerstore.drive.endurance[{#ID}])<{$POWERSTORE.DRIVE.ENDURANCE.MIN.HIGH}'
                  tags:
                    - tag: scope
                      value: availability
                - uuid: e28d7d07787e48738fbf18124ee84a98
                  expression: 'last(/Dell PowerStore by HTTP/powerstore.drive.endurance[{#ID}])<{$POWERSTORE.DRIVE.ENDURANCE.MIN.HIGH}'
                  name: 'Drive {#NAME}: vida útil restante crítica'
                  opdata: 'Restante: {ITEM.LASTVALUE1}'
                  priority: HIGH
                  description: 'O SSD tem menos de {$POWERSTORE.DRIVE.ENDURANCE.MIN.HIGH}% de endurance restante. Programe a substituição com a Dell.'
                  tags:
                    - tag: scope
                      value: availability
          master_item:
            key: powerstore.hardware.get
          lld_macro_paths:
            - lld_macro: '{#ID}'
              path: $.id
            - lld_macro: '{#LIFECYCLE_STATE}'
              path: $.lifecycle_state
            - lld_macro: '{#NAME}'
              path: $.name
            - lld_macro: '{#TYPE}'
              path: $.type
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
        - uuid: 6c4ae03f00894c5ab0c92d2829a77e12
