            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: powerstore.appliance.get
          tags:
            - tag: component
              value: inventory
        - uuid: d5f62768bd164b688e7834ec4c7dde09
          name: 'Appliance: dados brutos'
